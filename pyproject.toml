[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
# black-compatible
quote-style = "double"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --cov=node.encode --cov=node.storage --cov=gateway.ring --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["node", "gateway"]
omit = []

[tool.coverage.report]
fail_under = 90