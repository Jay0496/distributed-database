services:
  node1:
    container_name: node1
    build: .
    command: ["python", "-m", "node.main", "--id", "node1", "--port", "50051", "--peers", "node2:50052,node3:50053,node4:50054,node5:50055"]
    ports:
      - "50051:50051"
    environment:
      NODE_ID: node1
      NODE_PORT: "50051"
      DATA_DIR: /data
      TOKEN: ${TOKEN:-}
    volumes:
      - node1_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',50051)); s.close()\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  node2:
    container_name: node2
    build: .
    command: ["python", "-m", "node.main", "--id", "node2", "--port", "50052", "--peers", "node1:50051,node3:50053,node4:50054,node5:50055"]
    ports:
      - "50052:50052"
    environment:
      NODE_ID: node2
      NODE_PORT: "50052"
      DATA_DIR: /data
      TOKEN: ${TOKEN:-}
    volumes:
      - node2_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',50052)); s.close()\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  node3:
    container_name: node3
    build: .
    command: ["python", "-m", "node.main", "--id", "node3", "--port", "50053", "--peers", "node1:50051,node2:50052,node4:50054,node5:50055"]
    ports:
      - "50053:50053"
    environment:
      NODE_ID: node3
      NODE_PORT: "50053"
      DATA_DIR: /data
      TOKEN: ${TOKEN:-}
    volumes:
      - node3_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',50053)); s.close()\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  node4:
    container_name: node4
    build: .
    command: ["python", "-m", "node.main", "--id", "node4", "--port", "50054", "--peers", "node1:50051,node2:50052,node3:50053,node5:50055"]
    ports:
      - "50054:50054"
    environment:
      NODE_ID: node4
      NODE_PORT: "50054"
      DATA_DIR: /data
      TOKEN: ${TOKEN:-}
    volumes:
      - node4_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',50054)); s.close()\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  node5:
    container_name: node5
    build: .
    command: ["python", "-m", "node.main", "--id", "node5", "--port", "50055", "--peers", "node1:50051,node2:50052,node3:50053,node4:50054"]
    ports:
      - "50055:50055"
    environment:
      NODE_ID: node5
      NODE_PORT: "50055"
      DATA_DIR: /data
      TOKEN: ${TOKEN:-}
    volumes:
      - node5_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',50055)); s.close()\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  gateway:
    container_name: gateway
    profiles: ["tools"]
    build: .
    environment:
      PEERS: "node1:50051,node2:50052,node3:50053,node4:50054,node5:50055"
      TOKEN: ${TOKEN:-}
    command: ["sleep", "infinity"]
    depends_on:
      - node1
      - node2
      - node3
      - node4
      - node5

  node:
    profiles: ["test"]
    build: .
    command: ["pytest", "-q"]
    environment:
      TOKEN: ${TOKEN:-}

volumes:
  node1_data:
  node2_data:
  node3_data:
  node4_data:
  node5_data: