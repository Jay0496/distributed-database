syntax = "proto3";
package kv;

message PutRequest { string key = 1; bytes value = 2; string mode = 3; }
message PutResponse { bool ok = 1; string error = 2; int64 version = 3; }
message GetRequest { string key = 1; }
message GetResponse { bytes value = 1; bool found = 2; string error = 3; int64 version = 4; }
message HeartbeatRequest { string node_id = 1; int64 term = 2; }
message HeartbeatResponse { bool ok = 1; string leader = 2; repeated string degraded = 3; string mode = 4; int64 term = 5; }
message StoreShardRequest { string key = 1; int32 shard_index = 2; bytes data = 3; int64 version = 4; }
message StoreShardResponse { bool ok = 1; string error = 2; }
message FetchShardRequest { string key = 1; int32 shard_index = 2; }
message FetchShardResponse { bytes data = 1; bool present = 2; string error = 3; }
message HasShardRequest { string key = 1; int32 shard_index = 2; }
message HasShardResponse { bool present = 1; }
message ListKeysRequest {}
message ListKeysResponse { repeated string keys = 1; }
message GetLeaderRequest {}
message GetLeaderResponse { string leader = 1; repeated string degraded = 2; string mode = 3; int64 term = 4; int64 key_count = 5; }
message RaftLogEntry { int64 term = 1; int64 index = 2; string type = 3; bytes payload = 4; }
message AppendEntriesRequest { int64 term = 1; string leader_id = 2; int64 prev_log_index = 3; int64 prev_log_term = 4; repeated RaftLogEntry entries = 5; int64 leader_commit = 6; }
message AppendEntriesResponse { int64 term = 1; bool success = 2; }
message RequestVoteRequest { int64 term = 1; string candidate_id = 2; int64 last_log_index = 3; int64 last_log_term = 4; }
message RequestVoteResponse { int64 term = 1; bool vote_granted = 2; }
message SetModeRequest { string mode = 1; }
message SetModeResponse { bool ok = 1; string mode = 2; string error = 3; }

service KV {
  rpc Put(PutRequest) returns (PutResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc StoreShard(StoreShardRequest) returns (StoreShardResponse);
  rpc FetchShard(FetchShardRequest) returns (FetchShardResponse);
  rpc HasShard(HasShardRequest) returns (HasShardResponse);
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse);
  rpc GetLeader(GetLeaderRequest) returns (GetLeaderResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc SetMode(SetModeRequest) returns (SetModeResponse);
}